[package]
name        = "sel-deploy"
version     = "0.1.0"
edition     = "2021"
authors     = ["Chokri Bouzid <chokriabouzid@gmail.com>"]
description = "Cryptographically chained deployment timeline — built on SEL Core"
license     = "MIT"
repository  = "https://github.com/chokriabouzid-star/sel-deploy"
readme      = "README.md"
keywords    = ["deployment", "attestation", "audit", "devops", "cryptography"]
categories  = ["command-line-utilities"]

[lib]
name = "sel_deploy"
path = "src/lib.rs"

[[bin]]
name = "sel-deploy"
path = "src/main.rs"

[dependencies]
# ── SEL Core (canonical JSON + SHA-256) ──────────────────────────────
# نستخدم sel-common مباشرة لأنه يحتوي الـ primitives الأساسية
# TODO: انتقل إلى sel-core::SelKeyPair عند إصدار v1.1
sel-common = { git = "https://github.com/chokriabouzid-star/SEL.git", tag = "v1.0.0" }
# ── Ed25519 — مؤقت حتى sel-core v1.1 ────────────────────────────────
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand          = "0.8"

# ── SHA-256 + hex — نستخدمهما مباشرة لأن sel-common قد لا يصدّرهما ──
sha2 = "0.10"
hex  = "0.4"

# ── CLI ───────────────────────────────────────────────────────────────
clap       = { version = "4.5", features = ["derive"] }
anyhow     = "1.0"
thiserror  = "1.0"
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }

# ── Storage ───────────────────────────────────────────────────────────
rusqlite   = { version = "0.31", features = ["bundled"] }

# ── Data / Serialization ─────────────────────────────────────────────
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1.6", features = ["v4", "serde"] }
directories = "5.0"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
