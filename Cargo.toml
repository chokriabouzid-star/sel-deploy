[package]
name        = "sel-deploy"
version     = "0.2.0"
edition     = "2021"
rust-version = "1.74"
authors     = ["Chokri Bouzid <chokriabouzid@gmail.com>"]
description = "Cryptographically chained deployment timeline — built on SEL Core"
license     = "MIT"
repository  = "https://github.com/chokriabouzid-star/sel-deploy"
readme      = "README.md"
keywords    = ["deployment", "attestation", "audit", "devops", "cryptography"]
categories  = ["command-line-utilities"]

[lib]
name = "sel_deploy"
path = "src/lib.rs"

[[bin]]
name = "sel-deploy"
path = "src/main.rs"

[dependencies]
# SEL Core — canonical JSON + versioned SHA-256 (sel:v1.0:sha256:…)
sel-common = { git = "https://github.com/chokriabouzid-star/SEL.git", tag = "v1.0.0" }

ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand          = "0.8"
base64        = "0.22"

sha2 = "0.10"
hex  = "0.4"

clap       = { version = "4.5", features = ["derive"] }
anyhow     = "1.0"
thiserror  = "1.0"
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }

rusqlite   = { version = "0.31", features = ["bundled"] }

serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1.6", features = ["v4", "serde"] }
directories = "5.0"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
